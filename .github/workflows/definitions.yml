name: Refresh RuneLite definitions
on:
  workflow_dispatch:
    inputs:
      redeploy:
        description: 'Retry deployment even when definition tables are already current'
        type: boolean
        default: false
  schedule:
    - cron: '10 9 * * 1'
permissions:
  contents: write
  actions: write
concurrency:
  group: refresh-runelite-definitions
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Refresh all definitions at one RuneLite commit
        run: npm run refresh:definitions
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm test
      - run: npm run build
      - name: Detect changed tables
        id: tables
        shell: bash
        run: |
          if git diff --quiet -- src/core/item-ids.mjs src/core/item-labels.mjs src/core/gameval-ids.mjs; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'RuneLite definitions are already current.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Check backend deployment access before committing
        if: steps.tables.outputs.changed == 'true' || inputs.redeploy == true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo '::error::Add the CLOUDFLARE_API_TOKEN Actions secret before committing refreshed definitions. The frontend and PR backend must deploy together.'
            exit 1
          fi
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const {account_id}=JSON.parse(readFileSync('worker/wrangler.jsonc','utf8'));
          const response=await fetch(`https://api.cloudflare.com/client/v4/accounts/${account_id}/workers/subdomain`,{headers:{Authorization:`Bearer ${process.env.CLOUDFLARE_API_TOKEN}`},signal:AbortSignal.timeout(30000)});
          const data=await response.json();
          if(!response.ok||!data.success)throw new Error('Cloudflare denied account-level Workers subdomain access. Grant Workers Scripts Read at account scope (or Workers Scripts Write) to the deployment token. No refreshed tables have been committed by this run.');
          NODE
      - name: Commit validated definitions directly
        if: steps.tables.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/core/item-ids.mjs src/core/item-labels.mjs src/core/gameval-ids.mjs
          git commit -m 'Refresh RuneLite item, object and NPC definitions'
          gh auth setup-git
          # Never force-push main or silently rebase onto untested concurrent code.
          git push origin HEAD:main
      - name: Deploy matching PR backend
        if: steps.tables.outputs.changed == 'true' || inputs.redeploy == true
        run: npm run worker:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Publish matching frontend
        if: steps.tables.outputs.changed == 'true' || inputs.redeploy == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GITHUB_TOKEN commits do not trigger a new push workflow.
          gh workflow run pages.yml --ref main
          echo 'Validated the released definitions, deployed the PR backend, and started website publication.' >> "$GITHUB_STEP_SUMMARY"
