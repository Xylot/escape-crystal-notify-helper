name: Refresh RuneLite definitions
on:
  workflow_dispatch:
  schedule:
    - cron: '10 9 * * 1'
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: refresh-runelite-definitions
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Refresh all definitions at one RuneLite commit
        run: npm run refresh:definitions
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm test
      - run: npm run build
      - name: Save tested update for review
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          files=(src/core/item-ids.mjs src/core/item-labels.mjs src/core/gameval-ids.mjs)
          if git diff --quiet -- "${files[@]}"; then
            echo 'RuneLite definitions are already current.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          branch=codex/refresh-runelite-definitions
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          gh auth setup-git
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            git fetch origin "$branch:refs/remotes/origin/$branch"
            author=$(git show -s --format='%ae' "origin/$branch")
            if [ "$author" != '41898282+github-actions[bot]@users.noreply.github.com' ]; then
              echo 'The refresh branch has human changes. Review it before refreshing again.' >&2
              exit 1
            fi
          fi
          git add -- "${files[@]}"
          git commit -m 'Refresh RuneLite item, object and NPC definitions'
          git push --force-with-lease origin "HEAD:$branch"
          echo "Tested definitions: [review changes](https://github.com/$GITHUB_REPOSITORY/compare/main...$branch)" >> "$GITHUB_STEP_SUMMARY"
          cat > "$RUNNER_TEMP/definitions-pr.md" <<'BODY'
          Refresh item names, item labels, and object/NPC constants from the same RuneLite commit. The complete test suite and production build passed before this branch was updated.

          Review compatibility with the plugin's RuneLite release. Deploy the frontend and PR Worker together after merging, and reinstall the maintainer validator where used, so generated Java stays consistent across export paths.
          BODY
          existing=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --body-file "$RUNNER_TEMP/definitions-pr.md"
          elif ! gh pr create --base main --head "$branch" --title 'Refresh RuneLite definitions' --body-file "$RUNNER_TEMP/definitions-pr.md" > "$RUNNER_TEMP/definitions-pr-result" 2>&1; then
            if grep -qi 'not permitted to create or approve pull requests' "$RUNNER_TEMP/definitions-pr-result"; then
              echo '::warning::Repository settings disable Actions-created pull requests. The tested refresh branch and review link are available in the run summary.'
              echo 'Automatic PR creation is disabled by repository settings. Open a PR using the review link above.' >> "$GITHUB_STEP_SUMMARY"
            else
              cat "$RUNNER_TEMP/definitions-pr-result" >&2
              exit 1
            fi
          fi
